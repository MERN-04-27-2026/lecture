name: API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lecture_ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: e-commerce-project/server/package-lock.json
    
    - name: Install dependencies
      working-directory: e-commerce-project/server
      run: npm ci
    
    - name: Run database migrations
      working-directory: e-commerce-project/server
      run: npm run db:push
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lecture_ecommerce_test?schema=public
    
    - name: Run tests
      working-directory: e-commerce-project/server
      run: npm test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lecture_ecommerce_test?schema=public
        JWT_SECRET: test_secret_key
        JWT_REFRESH_SECRET: test_refresh_secret
        NODE_ENV: test
    
    - name: Run tests with coverage
      working-directory: e-commerce-project/server
      run: npm run test:coverage
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lecture_ecommerce_test?schema=public
        JWT_SECRET: test_secret_key
        JWT_REFRESH_SECRET: test_refresh_secret
        NODE_ENV: test
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./e-commerce-project/server/coverage/lcov.info
        flags: api-tests
        name: api-coverage
